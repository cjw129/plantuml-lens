name: Release extension package

# Triggered when a version tag is pushed (e.g. `git tag v0.4.0 && git push --tags`).
# The job packages extension/ into plantuml-lens.zip and publishes a GitHub
# Release with the archive as the asset.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write    # required to create a release and upload assets

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The tag is the source of truth. We strip the leading `v` and use the
      # remainder as the expected manifest version.
      - name: Extract version from tag
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "tag=${tag}"          >> "$GITHUB_OUTPUT"
          echo "version=${version}"  >> "$GITHUB_OUTPUT"
          echo "Tag: ${tag}  ->  version: ${version}"

      # Safety net: refuse to build if the manifest version doesn't match the tag.
      - name: Verify manifest version matches tag
        run: |
          set -e
          manifest_version=$(python -c "import json; print(json.load(open('extension/manifest.json'))['version'])")
          expected="${{ steps.tag.outputs.version }}"
          echo "manifest.json version: ${manifest_version}"
          echo "tag version:           ${expected}"
          if [ "${manifest_version}" != "${expected}" ]; then
            echo "::error::Version mismatch -- update extension/manifest.json to ${expected} before tagging."
            exit 1
          fi

      - name: Build ZIP
        run: python build_zip.py

      # Pull the matching section out of HISTORY.md so the release page shows
      # the same changelog entry. Falls back to a generic note if missing.
      - name: Extract release notes from HISTORY.md
        run: |
          python <<'PY' > release_notes.md
          import re, pathlib, sys
          version = "${{ steps.tag.outputs.version }}"
          text = pathlib.Path("HISTORY.md").read_text(encoding="utf-8")
          pattern = rf"^##\s+{re.escape(version)}\s*\n(.*?)(?=^##\s|\Z)"
          m = re.search(pattern, text, flags=re.MULTILINE | re.DOTALL)
          if m:
              sys.stdout.write(m.group(1).strip() + "\n")
          else:
              sys.stdout.write(f"Release {version}.\n")
          PY
          cat release_notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes-file release_notes.md \
            plantuml-lens.zip
